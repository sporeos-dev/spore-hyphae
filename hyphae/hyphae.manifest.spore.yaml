# yaml-language-server: $schema=../../spore-os-protocol/versions/v0d2/spore.manifest.v0.schema.yaml

id: dev.sporeos.hyphae
name: Hyphae Userspace Agent
description: Extends the reach of the hub into the user space.
trust: system

schema: SPORE/v0d2
version: 0.2.0
app: ./hyphae

api:
  - name: HYPHAE.manifest.read
    description: Read a node manifest from user space and return its raw YAML content.
      Use HYPHAE.file.hash to hash the manifest or its binary separately.
    risk: protected
    usage:
      - HYPHAE.manifest.read path=/path/to/node.manifest.spore.yaml
    inputs:
      - name: path
        type: string
        description: Absolute path to the .manifest.spore.yaml file in user space.
        required: true
    outputs:
      - name: content
        type: string
        description: Raw YAML content of the manifest.

  - name: HYPHAE.binary.hash
    description: Return the SHA-256 hash of the binary for a running process.
      The hub uses this at connect time to verify a node's binary matches what
      was recorded at install.
    risk: protected
    usage:
      - HYPHAE.binary.hash pid=1234
    inputs:
      - name: pid
        type: string
        description: PID of the running process to hash.
        required: true
    outputs:
      - name: hash
        type: string
        description: SHA-256 hex digest of the process binary.

  - name: HYPHAE.file.hash
    description: Return the SHA-256 hash of any file at the given path.
      Used at install time to hash a node binary or manifest directly,
      without requiring a running process.
    risk: protected
    usage:
      - HYPHAE.file.hash path=/path/to/binary
      - HYPHAE.file.hash path=/path/to/node.manifest.spore.yaml
    inputs:
      - name: path
        type: string
        description: Absolute path to the file to hash.
        required: true
    outputs:
      - name: hash
        type: string
        description: SHA-256 hex digest of the file.

  - name: HYPHAE.node.spawn
    description: Execute a node binary in the user session. Fire-and-forget;
      the hub learns the PID via socket peer credentials when the node connects.
    risk: protected
    usage:
      - HYPHAE.node.spawn binary=/path/to/binary
    inputs:
      - name: binary
        type: string
        description: Absolute path to the binary to execute.
        required: true
    outputs: []

  - name: HYPHAE.node.kill
    description: Send SIGTERM to a user-space process, escalating to SIGKILL
      after 3 seconds if it has not exited.
    risk: protected
    usage:
      - HYPHAE.node.kill pid=1234
    inputs:
      - name: pid
        type: string
        description: PID of the process to terminate.
        required: true
    outputs: []

topics: []
permissions: []